# Stage 3: 在 stage2 基础上扩大到 30k/3k manifest、20 epoch、bs=30、ImageAug3D 打开。
# 模型结构与 stage2 完全一致（与 pretrained/camera-only-seg.pth 对齐），差别集中在：
#   (1) data manifest：stage3_{train,val}.json（30000 / 3000，场景分层采样）
#   (2) samples_per_gpu 4 → 10（3 卡，全局 30），max_epochs 10 → 20
#   (3) ImageAug3D train-mode 打开：resize_lim [0.38, 0.55] + rot_lim ±5.4°（rand_flip 暂保持 false，因
#       需额外验证 LoadBEVSegmentationNavsim 是否同步翻转 GT；同理 GlobalRotScaleTrans 暂不加）
#   (4) lr_mult：vtransform 0.1 → 0.3（让 LSS depthnet 更充分地适应 NAVSIM domain），
#       decoder.backbone/neck 0.5 → 1.0（BEV 输入分布已与 pretrained 差距较大，让 decoder 和 head 同速学习）
#   (5) warmup 1500 iter（数据多，延长 warmup 防 FP16 loss scale 震荡），step [14, 18] 对齐 20 epoch
#   (6) GT 管线换成 LoadBEVSegmentationNavsimCached：预先由 tools/precompute_navsim_bev_gt.py
#       把 33k 帧的 (6,200,200) uint8 mask 写进单个 mmap 文件（~7.4GB），worker 只做 mmap read。
#       解决 nuPlan map API 每 worker 独立缓存导致的 RAM OOM + data_time 瓶颈问题。
seed: 0
deterministic: false
cudnn_benchmark: false

checkpoint_config:
  interval: 1
  max_keep_ckpts: 3

log_config:
  interval: 50
  hooks:
    - type: TextLoggerHook
    - type: TensorboardLoggerHook

load_from: pretrained/camera-only-seg.pth
resume_from: null

fp16:
  loss_scale:
    growth_interval: 2000

max_epochs: 20
runner:
  type: CustomEpochBasedRunner
  max_epochs: ${max_epochs}

dataset_type: NavsimBEVSegDataset
dataset_root: /home/wenzhe/wm_ws/WoTE/dataset
maps_root: /home/wenzhe/wm_ws/WoTE/dataset/maps
map_version: nuplan-maps-v1.0
image_size: [256, 704]
point_cloud_range: [-51.2, -51.2, -5.0, 51.2, 51.2, 3.0]

map_classes:
  - drivable_area
  - ped_crossing
  - walkway
  - stop_line
  - carpark_area
  - divider
object_classes: []

input_modality:
  use_lidar: false
  use_camera: true
  use_radar: false
  use_map: false
  use_external: false

train_pipeline:
  - type: LoadMultiViewImageFromFiles
    to_float32: true
  - type: ImageAug3D
    final_dim: ${image_size}
    resize_lim: [0.38, 0.55]      # ← 从 [0.48, 0.48] 改：随机尺度抖动，主要给 LSS depthnet
    bot_pct_lim: [0.0, 0.0]
    rot_lim: [-5.4, 5.4]          # ← 从 [0, 0] 改：小幅 image roll
    rand_flip: false              # 暂不开
    is_train: true                # ← 从 false 改，开启训练模式增强
  - type: LoadEmptyPoints
    coord_type: LIDAR
    load_dim: 5
    use_dim: [0, 1, 2, 3, 4]
  - type: LoadBEVSegmentationNavsimCached     # ← 离线预计算版：读 mmap，worker 0 内存开销
    masks_npy: logs/navsim_bev_gt_cache/stage3_masks.npy
    index_json: logs/navsim_bev_gt_cache/stage3_index.json
  - type: ImageNormalize
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  - type: DefaultFormatBundle3D
    classes: ${object_classes}
  - type: Collect3D
    keys: [img, points, gt_masks_bev]
    meta_keys:
      - camera_intrinsics
      - camera2ego
      - lidar2ego
      - lidar2camera
      - camera2lidar
      - lidar2image
      - img_aug_matrix
      - lidar_aug_matrix
  - type: GTDepth
    keyframe_only: true

test_pipeline:
  - type: LoadMultiViewImageFromFiles
    to_float32: true
  - type: ImageAug3D
    final_dim: ${image_size}
    resize_lim: [0.48, 0.48]      # test 保持固定 0.48
    bot_pct_lim: [0.0, 0.0]
    rot_lim: [0.0, 0.0]
    rand_flip: false
    is_train: false
  - type: LoadEmptyPoints
    coord_type: LIDAR
    load_dim: 5
    use_dim: [0, 1, 2, 3, 4]
  - type: LoadBEVSegmentationNavsimCached
    masks_npy: logs/navsim_bev_gt_cache/stage3_masks.npy
    index_json: logs/navsim_bev_gt_cache/stage3_index.json
  - type: ImageNormalize
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  - type: DefaultFormatBundle3D
    classes: ${object_classes}
  - type: Collect3D
    keys: [img, points, gt_masks_bev]
    meta_keys:
      - camera_intrinsics
      - camera2ego
      - lidar2ego
      - lidar2camera
      - camera2lidar
      - lidar2image
      - img_aug_matrix
      - lidar_aug_matrix
  - type: GTDepth
    keyframe_only: true

data:
  samples_per_gpu: 1             # 3 GPU × 10 = 全局 bs=30（GPU 0 被其他任务占用，仅用 1/2/3）
  workers_per_gpu: 2              # 配合 cached pipeline：worker 只 mmap-read 已预计算 GT，不再加载 nuPlan API
  train:
    type: ${dataset_type}
    dataset_root: ${dataset_root}
    ann_file: logs/navsim_finetune_stage3_train.json
    pipeline: ${train_pipeline}
    object_classes: ${object_classes}
    map_classes: ${map_classes}
    modality: ${input_modality}
    image_size: ${image_size}
    test_mode: false
    filter_empty_gt: false
    box_type_3d: LiDAR
  val:
    type: ${dataset_type}
    dataset_root: ${dataset_root}
    ann_file: logs/bev_compare_stage1_vs_pre_20.json
    pipeline: ${test_pipeline}
    object_classes: ${object_classes}
    map_classes: ${map_classes}
    modality: ${input_modality}
    image_size: ${image_size}
    test_mode: true
    filter_empty_gt: false
    box_type_3d: LiDAR
    lidar_align_to_nuscenes: true
  test:
    type: ${dataset_type}
    dataset_root: ${dataset_root}
    ann_file: logs/bev_compare_stage1_vs_pre_20.json
    pipeline: ${test_pipeline}
    object_classes: ${object_classes}
    map_classes: ${map_classes}
    modality: ${input_modality}
    image_size: ${image_size}
    test_mode: true
    filter_empty_gt: false
    box_type_3d: LiDAR
    lidar_align_to_nuscenes: true

evaluation:
  interval: 2
  pipeline: ${test_pipeline}

model:
  type: BEVFusion
  encoders:
    lidar: null
    camera:
      backbone:
        type: SwinTransformer
        embed_dims: 96
        depths: [2, 2, 6, 2]
        num_heads: [3, 6, 12, 24]
        window_size: 7
        mlp_ratio: 4
        qkv_bias: true
        qk_scale: null
        drop_rate: 0.0
        attn_drop_rate: 0.0
        drop_path_rate: 0.3
        patch_norm: true
        out_indices: [1, 2, 3]
        with_cp: false
        convert_weights: true
        init_cfg:
          type: Pretrained
          checkpoint: https://github.com/SwinTransformer/storage/releases/download/v1.0.0/swin_tiny_patch4_window7_224.pth
      neck:
        type: GeneralizedLSSFPN
        in_channels: [192, 384, 768]
        out_channels: 256
        start_level: 0
        num_outs: 3
        norm_cfg: {type: BN2d, requires_grad: true}
        act_cfg: {type: ReLU, inplace: true}
        upsample_cfg: {mode: bilinear, align_corners: false}
      vtransform:
        type: LSSTransform
        in_channels: 256
        out_channels: 80
        image_size: ${image_size}
        feature_size: ${[image_size[0] // 8, image_size[1] // 8]}
        xbound: [-51.2, 51.2, 0.4]
        ybound: [-51.2, 51.2, 0.4]
        zbound: [-10.0, 10.0, 20.0]
        dbound: [1.0, 60.0, 0.5]
        downsample: 2
  fuser: null
  decoder:
    backbone:
      type: GeneralizedResNet
      in_channels: 80
      blocks:
        - [2, 160, 2]
        - [2, 320, 2]
        - [2, 640, 1]
    neck:
      type: LSSFPN
      in_indices: [-1, 0]
      in_channels: [640, 160]
      out_channels: 256
      scale_factor: 2
  heads:
    object: null
    map:
      type: BEVSegmentationHead
      in_channels: 256
      grid_transform:
        input_scope: [[-51.2, 51.2, 0.8], [-51.2, 51.2, 0.8]]
        output_scope: [[-50, 50, 0.5], [-50, 50, 0.5]]
      classes: ${map_classes}
      loss: focal

# 基准 lr=1e-4：vtransform 3e-5、decoder 1e-4、head 1e-4。Swin/FPN 仍以 lr_mult=0 冻结
# （梯度为 0；BN running_stats 漂移未修正，若要彻底冻结可另加 FreezeModuleHook）。
optimizer:
  type: AdamW
  lr: 1.0e-4
  weight_decay: 0.01
  paramwise_cfg:
    custom_keys:
      absolute_pos_embed: {decay_mult: 0}
      relative_position_bias_table: {decay_mult: 0}
      encoders.camera.backbone: {lr_mult: 0.0}
      encoders.camera.neck: {lr_mult: 0.0}
      encoders.camera.vtransform: {lr_mult: 0.3}    # 0.1 → 0.3：攻 domain gap 主战场
      decoder.backbone: {lr_mult: 1.0}              # 0.5 → 1.0
      decoder.neck: {lr_mult: 1.0}                  # 0.5 → 1.0
      heads.map: {lr_mult: 1.0}

optimizer_config:
  grad_clip: {max_norm: 35, norm_type: 2}

lr_config:
  policy: step
  warmup: linear
  warmup_iters: 1500        # 500 → 1500，30k/bs30 下每 epoch 1000 iter → warmup 约 1.5 epoch
  warmup_ratio: 0.001
  step: [14, 18]
  gamma: 0.1
